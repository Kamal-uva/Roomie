name: Roomie checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Repository does not yet have a package-lock.json.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
